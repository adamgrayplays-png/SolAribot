[workspace]
members = [
    "solAribot-core",
    "solAribot-market-data",
    "solAribot-execution",
]
resolver = "2"

[workspace.dependencies]
solana-sdk = "2.3"
solana-client = "2.3"
solana-program = "2.3"
solana-account-decoder = "2.3"
solana-transaction-status = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
parking_lot = "0.12"
bs58 = "0.5"
hex = "0.4"
redis = { version = "0.28", features = ["tokio-comp", "aio"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
rayon = "1"
