# =============================================================================
# SolAribot — Mainnet Configuration
# =============================================================================
# Overrides default.yaml for production mainnet deployment
# =============================================================================

network:
  cluster: "mainnet-beta"
  rpc:
    # Premium RPC recommended for production
    url: "https://solana-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
    fallbacks:
      - "https://api.mainnet-beta.solana.com"
      - "https://solana-api.projectserum.com"
      - "https://rpc.ankr.com/solana"
    rate_limit: 200

dex:
  poll_interval_ms: 200  # Faster polling on mainnet

arbitrage:
  min_profit_sol: 0.002  # Higher threshold due to gas costs
  max_position_sol: 20.0
  daily_loss_limit_sol: 2.0
  max_concurrent_trades: 5
  trade_cooldown_secs: 30  # Faster cooldown on mainnet

ml:
  min_confidence: 0.8  # Higher bar for real trades

risk:
  max_daily_drawdown_sol: 10.0
  max_position_pct: 0.05  # 5% of wallet
  sandbox_mode: false

logging:
  level: "info"
  format: "json"